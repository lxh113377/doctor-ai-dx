# 提交前快检子集（秒级；与 CI 同源判据，不重复 CI 全量十件套）
# 安装：pip install pre-commit && pre-commit install
# 手动全量：pre-commit run --all-files
# 说明：全部使用 language: system 复用仓内既有守卫脚本，零网络拉取、零重复实现
#       （判据单一源仍是 frontend/tests/*，本文件只是提交时机的编排）
repos:
  - repo: local
    hooks:
      - id: version-truth
        name: 版本真值五方对账（五处声明：package.json/version.js/version.py/openapi.json/package-lock + 最新 tag 单调不减）
        entry: node frontend/tests/version_guard.mjs
        language: system
        pass_filenames: false

      - id: kb-guard
        name: 知识库 schema / 溯源棘轮 / 双端数据零漂移
        entry: node frontend/tests/kb_guard.mjs
        language: system
        pass_filenames: false

      - id: api-contract
        name: openapi 契约 ↔ Functions 实现双向对账
        entry: node frontend/tests/api_contract_guard.mjs
        language: system
        pass_filenames: false

      - id: openapi-version-drift
        name: OpenAPI 版本与后端单一源一致
        entry: python scripts/gen_openapi.py --check
        language: system
        pass_filenames: false
        files: ^(backend/app/(version|main)\.py|backend/app/routers/.*|docs/openapi\.json)$

      # 静态检查两枚（第十四轮补）：与 CI 同源判据、同配置文件。
      # 刻意不用 hook 级 cwd：pre-commit 4.6.2 对 repo:local 的 cwd 键只告警不生效（实测），
      # 基准靠 frontend/lint.mjs 内部钉目录；ruff 的规则集按"从被检文件向上找配置"解析，仓根直跑等效。
      - id: eslint
        name: 前端/Functions/门禁脚本 ESLint（--max-warnings=0，警告也算红）
        entry: node frontend/lint.mjs
        language: system
        pass_filenames: false
        files: \.(js|jsx|mjs)$

      - id: ruff
        name: ruff 静态检查（backend + scripts，规则集钉在 ruff.toml）
        entry: ruff check backend/app backend/tests scripts
        language: system
        pass_filenames: false
        files: \.py$

      - id: type-gate
        name: Python 类型门禁（mypy，阈值单一源 fixtures/type_floor.json）
        entry: python scripts/type_gate.py --quiet
        language: system
        pass_filenames: false
        files: \.py$

      - id: lock-gate
        name: 依赖锁定对账（requirements.lock 钉版+哈希、且 Dockerfile 真从锁安装）
        entry: python scripts/lock_guard.py --quiet
        language: system
        pass_filenames: false
        files: ^(backend/(requirements|Dockerfile)|backend/requirements\.lock)

      - id: suite-guard
        name: 测试套件单源对账（清单↔磁盘↔CI/compose/覆盖率三处消费方）
        entry: python scripts/suite_guard.py --quiet
        language: system
        pass_filenames: false
        files: ^(backend/(tests/|selftest)|backend/tests/suite\.json|docker-compose\.yml|\.github/workflows/ci\.yml|frontend/package\.json|scripts/suite_guard\.py)

      - id: dep-completeness
        name: 依赖声明完整性（import ⊆ 三面声明面 + peer ↔ package-lock 相容）
        entry: python scripts/dep_completeness.py
        language: system
        pass_filenames: false
        files: ^(backend/requirements[^.]*\.txt|backend/requirements\.lock|frontend/package[^.]*\.json|frontend/src/|frontend/functions/|backend/app/|scripts/)

      - id: action-pin
        name: Actions 钉版与最小权限（本机离线档；上游真值对账由 CI infra-lint 出）
        entry: python scripts/action_pin.py --verify --offline --quiet
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$

      # 工作流 run 块的本地语法探针（第四十轮，台账 #47 同族的"CI 才判红"时机缺口）。
      # 触发实测：本轮 infra-lint 报 live-smoke.yml:88 shellcheck SC1073——全角括号落进 $( ) ⇒
      # 提交时全绿、CI 才红，而 Release 在同一时刻已经发出。本机没有 docker 守护进程、
      # shellcheck/actionlint 不在 PATH ⇒ 跑得动的只有 `bash -n`（解析级）＋**已枚举**的启发式形态。
      # 第四十二轮实测：只有解析级时，同族第二次仍从 CI 判红（`SC2012: Use find instead of ls`，
      # run 36295599503）⇒ 该轮把「命令替换内全角标点」与「ls 枚举喂程序」两条钉进探针。
      # 边界不变：**不冒充 actionlint**，未枚举的风格级规则仍只有 CI 侧能抓（残留缺口见 docs/PITFALLS.md C6）。
      # 语言选 system 而非 python 包：钩内再起 bash 由脚本自己解析（实测 Windows 上裸 `bash`
      # 会命中 WSL ⇒ rc=127 假红；脚本显式优先 Git Bash，找不到就只跑启发式腿，绝不假红）。
      - id: shell-block-probe
        name: 工作流 run 块探针（bash -n ＋已枚举 shellcheck 形态：命令替换内全角标点 / SC2012 用 ls 枚举）
        entry: python scripts/shell_block_probe.py
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$

      - id: text-hygiene
        name: 全仓文本控制字符扫描（防"正则里的词边界被转义成裸退格符"类死判据）
        entry: python scripts/check_text_hygiene.py --quiet
        language: system
        pass_filenames: false

      # 拼写看守进提交链（第三十七轮，台账 #112）。为什么这条要占一个钩位：
      # 同族事故第三次复发——v1.32.0（自造标识符 `normL`）、v1.33.0 前一次（`nd`）、本次 v1.34.0
      # （`abl` 被认成 able 的错拼）三次都是**提交时全绿、CI 才判红**，前两次只改代码没补载体，
      # 于是第三次照抄。判据本身早已在册（ci.yml infra-lint + release.yml），缺的是本地时机。
      # 形态是实测选出来的，不是猜的（三条都真跑过）：
      #   ① language: system + entry: codespell ⇒ 本机 `python -m codespell_lib` 报 No module named codespell_lib，
      #      克隆后没装 dev 件的人每次提交都被 "Executable `codespell` not found" 拦死；
      #   ② requirements: backend/requirements-dev.txt ⇒ pre-commit 4.6.2 对 repo: local 判该键非法
      #      （实测 WARNING Unexpected key(s) + 环境是空的，仍然 Executable not found）；
      #   ③ additional_dependencies: ["-r", "backend/..."] ⇒ pip 的工作目录不是仓根
      #      （实测 Could not open requirements file [Errno 2]）。
      # 故取「钩内逐字钉一条区间」，代价是钉版在 requirements-dev.txt 与本文件各有一份 ⇒
      # 由 scripts/dep_completeness.py 逐字对账（改一处忘改另一处即判红）。规则集仍只有 .codespellrc 一份。
      - id: codespell
        name: 英文拼写看守（同 CI infra-lint 一条判据；规则钉 .codespellrc，版本钉由 dep_completeness 对账）
        entry: codespell
        language: python
        additional_dependencies: ["codespell>=2.4.1,<2.5"]
        pass_filenames: false
        always_run: true
