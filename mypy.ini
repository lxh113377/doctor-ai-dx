# 全仓 Python 类型检查唯一权威配置（与 ruff.toml 同构：钉死判据，不依赖默认值）。
# 落地依据（2026-09-25 第十五轮对标）：OpenEMR 用 phpstan level 10 + baseline-diff 工作流，
# phlox 有 tsc 但 `strict:false / checkJs:false`（等于装了不用），ragflow 只有 ruff，medical-rag 零配置。
# 我方选择：**不开基线豁免层**，存量已实测清零（22 文件 0 error），因此门槛直接设成 0；
# 将来若确需豁免，必须新增 baseline 文件并在 `frontend/tests/fixtures/type_floor.json` 写明原因，
# 禁止用注释/ignore 静默放行（那是把类型层退回"装饰性门禁"）。
[mypy]
python_version = 3.12
files = backend/app, scripts
# 严格档：连未标注函数的函数体也检查（= 与 phlox strict:false 相反的取向）
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
show_error_codes = True
show_column_numbers = False
# 第三方缺 stub 不算我方缺陷：httpx/fastapi 在运行时镜像里不装 types-*，
# 不忽略会让门禁因依赖打包状态而红（判据必须只反映本仓代码质量）。
ignore_missing_imports = True

# 本文件刻意不含任何 per-module 豁免段：实测把唯一候选（生成物 app/semantic_neighbors 的
# var-annotated）关掉后仍是 22 文件 0 error，留着就是「以后也许用得上」的暗门。
# 需要豁免时必须在此写明理由 + 对应实测，不接受无声 ignore。
