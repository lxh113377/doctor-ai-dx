# 全仓 Python 静态检查唯一权威配置（backend 业务码 + tests + scripts 工具链）。CI 与本地均按本文件判定。
# 钉死规则集的理由（2026-09-25 实测）：ruff 各版本默认 select 并不相同（本机 0.16 默认已含
# I/B/UP/RUF100，旧版只含 E4/E7/E9/F）。不写本文件 ⇒ 换 ruff 版本即换判据，本地绿不代表 CI 绿。
# 升级 ruff 时必须重跑本门禁并逐条复核新增规则，禁止一次性打开新规则。
# 刻意不选的规则（写明理由，避免后来者以为是漏配）：
#   BLE001（宽 except）：七类失败安全降级就是靠捕获上游异常兜住的，属产品设计而非疏漏，
#                        逐条断言在 tests/test_live_path.py；判红只会逼人改坏兜底。
#   RUF100（多余 noqa）：ruff 的 E402 不惩罚 sys.path 注入后的 import，pycodestyle 会——
#                        保留 # noqa: E402 是跨检查器余量，钉 RUF100 会在换工具时判据反转。
# 生成物 app/semantic_neighbors.py 正常参与检查（改坏语法必须被抓），但其内容由
# scripts/build_semantic_neighbors.py 生成并被 semantic_guard.mjs 按语料指纹核对，禁止手工重排。
line-length = 120
target-version = "py312"
src = ["backend/app", "backend/tests", "scripts"]

[lint]
select = [
  "E4", "E7", "E9",   # pycodestyle 硬错误
  "F",                # pyflakes：死导入、未用变量、未定义名
  "I",                # isort：导入次序（双端镜像文件靠它保持可读对齐）
  "UP",               # pyupgrade：面向 3.12 的过时写法
  "B",                # bugbear：真实缺陷类（B904 raise-without-from、循环变量捕获等）
]
