name: Release artifacts (tag)

# 第十六轮对标落地：OpenEMR `Build Release on Tag` / ragflow `release` / phlox `Build and Release`
# 三家都是"打 tag 即由机器产出发布工件"，我方此前全靠本机手工 `git archive` + `gh release create`，
# 于是出现过"源码包内容与 tag 不同步"的人工漂移（同一轮内三次重锚）。本工作流把该链变成机器判据：
#   全部门禁绿 ⇒ 才产出「tag 源码包 + 双端 SBOM + SHA256SUMS」并挂到 Release 上。
# 边界（如实声明）：本站点部署仍由本机 wrangler 手工执行（`ci.yml` 的 deploy 作业按 AUTO_DEPLOY 决定，
# 未配 Cloudflare Token 前不接管）；本工作流只管"发布工件的可复现与可审计"。
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: '要为哪个 tag 出包（留空则用当前 ref）'
        required: false
        default: ''

permissions:
  contents: write
  packages: write   # 第二十二项：镜像推 GHCR 需要（只在本工作流的出包之后才用）

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install（运行时从锁安装 + dev 件，与 ci.yml 同源）
        # **必须分两条命令**：`--require-hashes` 会作用于该次 pip 的**全部**需求输入，
        # 而 requirements-dev.txt 是区间声明（coverage>=…、ruff>=…<0.17），混在一起 pip 直接报
        # 「all requirements must have their versions pinned with ==」。
        # 实测教训：v1.16.0 首发时就是写成一条 `-r lock -r dev` ⇒ release 作业 14 秒判红。
        # scripts/lock_guard.py 已把「不得在同一行混用 --require-hashes 与非锁需求文件」钉成判据。
        run: |
          python -m pip install --require-hashes -r backend/requirements.lock
          python -m pip install -r backend/requirements-dev.txt
          cd frontend && npm ci --no-audit --no-fund

      - name: 出包前置门禁（任一失败即不产出工件）
        run: |
          set -e
          python scripts/lock_guard.py
          ruff check backend/app backend/tests scripts
          python scripts/type_gate.py --quiet
          python scripts/check_text_hygiene.py --quiet
          python scripts/suite_guard.py --quiet
          cd frontend
          npm run lint:js
          npm test
          npm run coverage:js
          npm run coverage:py
          npm run build
          npm run test:bundle
          python ../scripts/gen_openapi.py --check

      - name: SBOM · npm 侧（cyclonedx-npm 钉版 + 与声明对账）
        run: |
          cd frontend
          npm run sbom
          node tests/sbom_guard.mjs --sbom docs/sbom/frontend.cdx.json --manifest npm

      - name: SBOM · pip 侧（由 requirements.lock 声明式产出 + 与锁逐包对账）
        # 第十八轮把这份 SBOM 从 `environment` 模式改回**声明式**：environment 模式报的是"这台机器装了 282 个什么"
        # （含 pip/setuptools/cyclonedx-bom 自身等与镜像无关的组件），对审计是假面；
        # 而运行时镜像里恰好只装锁中的 22 个包 ⇒ 只有从 requirements.lock 生成的 SBOM 才等于交付物本身。
        # 历史：v1.14.0 当时只能走 environment，因为本仓 pip 侧没有钉版（声明式只出 5 条空壳）——该前提已由 r18 消除。
        run: |
          python -m pip install --quiet "cyclonedx-bom==7.4.0"
          cyclonedx-py requirements backend/requirements.lock --of JSON --output-reproducible -o docs/sbom/backend.cdx.json
          cd frontend
          node tests/sbom_guard.mjs --sbom docs/sbom/backend.cdx.json --manifest pip

      - name: 源码包 = tag 内容（可复现，git archive 不含未跟踪文件）
        # --mtime 钉成 tag 提交时间 + TZ 钉成 UTC0：实测**同一环境下重复构建逐字节相同**。
        # 第十七轮把"跨环境为何不等"归因清楚了（**不是** git 版本/容器元数据）：
        #   ① 行尾：Windows 默认 core.autocrlf=true 使 git archive 导出时 LF→CRLF（实测 119/122 文件字节不同）
        #       ⇒ 已由仓内 .gitattributes（* text=auto eol=lf）钉死；
        #   ② 时间戳：zip 的 MS-DOS 时间字段按归档进程时区渲染 ⇒ TZ=UTC0。
        # 两个成因都消掉后实测：本机 `TZ=UTC0 git -c core.autocrlf=false archive --mtime=<tag 时间>`
        # 产出的包与本作业产出的包 **SHA256 全等**（v1.15.0 实测 168f697d…，由 scripts/release_repro_check.py 判定）。
        env:
          TZ: UTC0
        run: |
          mkdir -p dist-release
          MT=$(git log -1 --format=%ct "$TAG")
          git archive --format=zip --mtime="$MT" -o "dist-release/doctor-ai-dx-source-${TAG}.zip" HEAD
          python - <<'PY'
          import hashlib, os, zipfile
          p = os.path.join("dist-release", f"doctor-ai-dx-source-{os.environ['TAG']}.zip")
          names = [n for n in zipfile.ZipFile(p).namelist() if not n.endswith("/")]
          digest = hashlib.sha256(open(p, "rb").read()).hexdigest()
          print(f"源码包文件数={len(names)} sha256={digest}")
          assert len(names) > 100, "源码包文件数异常（可能 tag checkout 不完整）"
          PY

      - name: 可复现性自证（同环境二次构建全等 + 零 CRLF + 非空证明）
        # 只跑一次出包不算"可复现"——本步把主张变成判据：同一 ref 连出两个包必须同 sha，
        # 且包内文本零 CRLF（防 .gitattributes 被删或被 tree 外因素绕过）。
        run: python scripts/release_repro_check.py --ref "$TAG"

      - name: 准备构建器（buildx；build-push-action 的前置）
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR（用工作流自带 GITHUB_TOKEN，不引入额外凭据）
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像发布（GHCR，随 tag 双标签：<版本> + latest）
        # 对标取证（当轮实测）：`gh api users/bloodworks-io/packages?package_type=container` 查到公开包 phlox，
        # 而 `gh api users/lxh113377/packages?package_type=container` 返回 **0 个包** ⇒ 我方镜像只在 CI 里临时 build，
        # 评审与用户仍须自装 Python/Node 或自己 build。本步把 Dockerfile 的产物变成"一条命令可拉取"的交付物。
        # 顺序刻意排在所有门禁与源码包/SBOM 之后：判据任一红就不推镜像。
        # ragflow/openemr 的镜像发布走 Docker Hub，本机 hub.docker.com 不可达（实测 http=000/21s 超时）⇒ 未独立核验，只记已知。
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/doctor-ai-dx:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/doctor-ai-dx:latest

      - name: 放开包可见性（尽力而为；真判据在下一步的匿名 manifest 实测）
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        # 实测记录：本仓该 PATCH 无论用 GITHUB_TOKEN 还是本机 PAT 都回 404（`users/{login}/packages/...`
        # 对个人包要求 higher-scope token），而包实际是 **public**（源仓库公开 ⇒ GHCR 默认公开）。
        # 所以这一步只是"若将来仓库转私有仍能自愈"的尝试，continue-on-error 是故意的：
        # 不能拿一个已知 404 的接口当发布门禁，也不能因它 404 就断定不可拉取（那是下一步的事）。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH             "users/${{ github.repository_owner }}/packages/container/doctor-ai-dx/visibility"             --input - <<< '{"visibility":"public"}' ||             echo "可见性接口不接受当前凭据（继续，由 manifest 实测判定是否真的可匿名拉取）"

      - name: 镜像可拉取实证（**匿名**走 GHCR token 交换，模拟评审侧视角）
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        # 刻意不带任何凭据：认证可读是最低要求，"评审能不能一条命令拉下来"才是交付标准。
        # v1.18.0 首跑本步判红，当时提示语写作"包可见性多半仍是 private"——**归因错了**：
        # 实测 build-push-action 推的是 OCI **index**（mediaType=application/vnd.oci.image.index.v1+json），
        # 而本步 Accept 只列了 manifest 两种类型 ⇒ registry 回 404 `MANIFEST_UNKNOWN: OCI index found, but
        # Accept header does not support OCI indexes`。包始终是 public。教训：判据红先读响应体再改状态，
        # 猜测式提示语会把下一轮排查带到别的系统上（本机已用同一命令实证两类型 404 / 四类型 200）。
        # 因此现在按状态码分支报错，并把响应体一起打出来。
        run: |
          set -e
          IMG="${{ github.repository_owner }}/doctor-ai-dx"
          TOK=$(curl -s --max-time 60 "https://ghcr.io/token?scope=repository:${IMG}:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          test -n "$TOK" || { echo "::error::匿名 token 交换失败（GHCR 端点异常）"; exit 1; }
          ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"
          code=$(curl -s -o /tmp/mf.json -w "%{http_code}" --max-time 60 -H "Authorization: Bearer ${TOK}" -H "Accept: ${ACCEPT}" "https://ghcr.io/v2/${IMG}/manifests/${{ github.ref_name }}")
          echo "匿名 manifest http=$code"
          if [ "$code" != "200" ]; then
            echo "--- 响应体 ---"; cat /tmp/mf.json
            case "$code" in
              401|403) echo "::error::匿名被拒（$code）=包可见性仍是 private。改法：Packages → doctor-ai-dx → Settings → Make public 后重跑。" ;;
              404) echo "::error::404 且已带 index 类型 ⇒ 该 tag 未推上去或名字不对（对照上一步 build-push 的 tags 输出）。" ;;
              *) echo "::error::匿名拉取失败（$code），非预期状态码，按响应体排查。" ;;
            esac
            exit 1
          fi
          test -s /tmp/mf.json
          # 只拿到 200 还不够：必须是"有子清单的 index"，否则等于验证了一个空壳。
          python3 -c "import json,sys; d=json.load(open('/tmp/mf.json')); n=len(d.get('manifests') or ([1] if d.get('config') else [])); print('platforms/children=%d'%n); sys.exit(0 if n>=1 else 1)"

      - name: SHA256SUMS（三个工件逐一可核验）
        run: |
          cd dist-release
          cp ../docs/sbom/frontend.cdx.json ../docs/sbom/backend.cdx.json .
          sha256sum * | tee SHA256SUMS.txt
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.TAG }}
          path: dist-release/*
          if-no-files-found: error

      - name: 发布正文由 CHANGELOG 机器产出（关闭台账#23：正文入版本控制且可复算）
        # 上一版这里是"先建占位正文，再人工补双语说明"——占位一旦忘了补，评审看到的 Release 正文就是空话，
        # 而且**正文不在版本控制里**，无法对账也无法复现。本轮改为：正文唯一来源 = 仓内 `CHANGELOG.md`
        # 对应 `## [x.y.z]` 小节，缺小节／正文过短一律判红（宁可不出 Release，也不出没有说明的 Release）。
        run: |
          set -e
          VER="${TAG#v}"
          python3 - "$VER" "${{ github.repository_owner }}" <<'PY'
          import sys, pathlib
          ver = sys.argv[1]
          tag = f"v{ver}"
          owner = sys.argv[2]
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          head, body, seen = f"## [{ver}]", [], False
          for ln in lines:
              if ln.startswith(head):
                  seen = True
                  continue
              if seen and ln.startswith("## ["):
                  break
              if seen:
                  body.append(ln)
          section = "\n".join(body).strip()
          if not seen:
              print(f"::error::CHANGELOG.md 里没有 {head} 小节 ⇒ 拒绝用占位正文发 Release（先补变更说明）")
              sys.exit(1)
          if len(section) < 200:
              print(f"::error::{head} 小节正文仅 {len(section)} 字符（<200）＝说明不足以给人读，判红")
              sys.exit(1)
          assets = (f"doctor-ai-dx-source-{tag}.zip", "frontend.cdx.json", "backend.cdx.json", "SHA256SUMS.txt")
          notes = "\n".join([
              "本 Release 的**工件与正文均由 CI 产出**（打 tag 即出包，无人工二次编辑）：正文取自仓内 `CHANGELOG.md` 的对应小节，可离线复算。",
              "",
              "## 一条命令拉取运行环境",
              "",
              "```bash",
              f"docker run --rm -p 8000:8000 ghcr.io/{owner}/doctor-ai-dx:{tag}",
              f"# 镜像内自证（套件清单单一源，6 套全跑）：",
              f"docker run --rm --entrypoint python ghcr.io/{owner}/doctor-ai-dx:{tag} selftest.py",
              "```",
              "",
              "## 独立核验（不需要信任任何人的机器）",
              "",
              "```bash",
              "# 1) 下载本 Release 全部资产后，逐条核对校验和",
              "sha256sum -c SHA256SUMS.txt",
              "# 2) 源码包内容必须等于 tag 的 git 树（同环境可字节复现）",
              f"git archive --format=zip --mtime=$(git log -1 --format=%ct {tag}) {tag} | sha256sum",
              "```",
              "",
              "资产清单：" + ", ".join(assets),
              "",
              "---",
              "",
              section,
          ])
          pathlib.Path("dist-release/NOTES.md").write_text(notes + "\n", encoding="utf-8")
          print(f"NOTES.md 由 CHANGELOG {head} 生成（正文 {len(section)} 字符，全文 {len(notes)} 字符）")
          PY
          test -s dist-release/NOTES.md

      - name: 挂到 Release（正文用上一生成的 NOTES.md；已存在则连正文一起更新）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file dist-release/NOTES.md
          else
            gh release edit "$TAG" --notes-file dist-release/NOTES.md
          fi
          cd dist-release
          gh release upload "$TAG" doctor-ai-dx-source-*.zip frontend.cdx.json backend.cdx.json SHA256SUMS.txt --clobber
          cd ..
          gh release view "$TAG" --json tagName,assets,body --jq '"assets=" + ([.assets[].name] | join(",")) + " body_len=\(.body|length)"'
