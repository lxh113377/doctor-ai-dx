name: Dependency audit

on:
  schedule:
    - cron: "30 1 * * 1"   # 每周一 09:30 UTC+8
  pull_request:
    paths:
      - frontend/package-lock.json
      - backend/requirements.txt
      - .github/workflows/dep-audit.yml
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: npm audit（high 即红；已知 dev-only 项按批处置）
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: pip-audit（观察期：报告进 CI 日志，不阻断；两周后无存量误伤再移除 allow-toggle 转硬门禁）
        working-directory: backend
        run: |
          python -m pip install --quiet pip-audit
          python -m pip_audit -r requirements.txt --strict
        continue-on-error: true   # 观察期开关：删掉本行即转硬门禁（有意为之，非静默吞错）
