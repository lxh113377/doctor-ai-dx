name: Dependency audit

on:
  schedule:
    - cron: "30 1 * * 1"   # 每周一 09:30 UTC+8
  pull_request:
    paths:
      - frontend/package-lock.json
      - backend/requirements.txt
      - .github/workflows/dep-audit.yml
  workflow_dispatch: {}

# 第二十三轮对标（2026-09-26 实测）：peer phlox 4/4 工作流顶层显式 permissions、openemr 61/79 有；
# 我方此前 1/5。不写这一块的默认值是"仓库设置说了算"，同一份 YAML 在不同仓库设置下拿到的权限不同，
# 最小权限就无从核对。判据在 scripts/action_pin.py（--verify），越权即判红。
permissions:
  contents: read

jobs:
  image-scan:
    # 第二十一轮补（对标：ragflow 仓根带 `.trivyignore` ⇒ 同类把**镜像层**纳入 CVE 扫描；我方自 r20 起
    # 已把镜像发布给评审，但既有 audit 只扫依赖清单（npm/pip），基础镜像的 OS 包完全不在射程内）。
    # 阻断档的取值来自实测而非拍脑袋：本机扫我们刚发布的镜像得 HIGH+CRITICAL 共 **44** 条，
    # 逐条查 FixedVersion 后 **全部无可用修复版本**（Debian 侧未发补丁），CRITICAL=0
    # ⇒ 阻断档＝「CRITICAL 且已有修复版本」（`--ignore-unfixed`）。若按 HIGH 阻断，CI 会在上游出补丁前
    # 长期红灯＝cry-wolf（同 r17 link_health 计数基线的教训），所以 HIGH 全量只写报告不拦。
    # 判据真的会咬（机制反例）：同一镜像去掉 `--ignore-unfixed`、按 `HIGH,CRITICAL` 扫 ⇒ 输出
    # `Total: 44 (HIGH: 44, CRITICAL: 0)` 且 `--exit-code 1` 返回 **rc=1**（本机实测）。
    # trivy 版本钉死 0.61.0：DB 规则集随版本变，判据不能跟着漂（升版须人工复核后再改这里）。
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: 扫 GHCR 上已发布的 latest（匿名可拉，故不需要任何凭据）
        run: |
          set -eu
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.61.0 image --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "ghcr.io/${{ github.repository_owner }}/doctor-ai-dx:latest"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: npm audit（high 即红；已知 dev-only 项按批处置）
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: pip-audit（观察期：报告进 CI 日志，不阻断；两周后无存量误伤再移除 allow-toggle 转硬门禁）
        working-directory: backend
        run: |
          python -m pip install --quiet pip-audit
          python -m pip_audit -r requirements.txt --strict
        continue-on-error: true   # 观察期开关：删掉本行即转硬门禁（有意为之，非静默吞错）
