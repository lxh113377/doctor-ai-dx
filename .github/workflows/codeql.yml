name: CodeQL static analysis

# 2026-09-25 第十四轮实测补 push：此前 30 次分析全部落在 refs/pull/*/merge，refs/heads/main 为零
# ——即生产分支从未被静态扫描过，判据只挂在 Dependabot PR 这条"偶尔走"的路径上
# （与 round9「门禁挂在长期 skipped 的 deploy 作业 = 没有门禁」同族）。补 push 后每次 main 推送必扫。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 4'

# 第二十三轮对标（2026-09-26 实测）：peer phlox 4/4 工作流顶层显式 permissions、openemr 61/79 有；
# 我方此前 1/5。不写这一块的默认值是"仓库设置说了算"，同一份 YAML 在不同仓库设置下拿到的权限不同，
# 最小权限就无从核对。判据在 scripts/action_pin.py（--verify），越权即判红。
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52  # v3.38.2
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52  # v3.38.2
        if: matrix.language == 'javascript-typescript'
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52  # v3.38.2
        with:
          category: '/language:${{ matrix.language }}'
