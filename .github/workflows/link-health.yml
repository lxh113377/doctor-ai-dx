name: Citation link health

on:
  schedule:
    - cron: "0 2 * * 3"   # 每周三 10:00 UTC+8（与 dep-audit 错开）
    # ⚠️ 第四十四轮曾记："event=schedule 总数 = 0 ⇒ cron 写了也没人执行"——**第四十六轮纠正**：
    #   本作业入档 9/25，cron 是每周三，到 9/27 为止**一个到点时刻都还没来过**，0 条 run 是"未到期"不是"不触发"
    #   （同仓 live-smoke 是日排班，9/27 04:30Z 首次到点就真产出了 run）。`--patrol` 现在逐条印到点账。
    #   保留 cron（下一个周三它会自己开始跑），另加下面这条不等排班的通路（main 的 CI 完成后跑）。
  workflow_run:
    workflows: ["CI - build & deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: link-health
  cancel-in-progress: false

# 第二十三轮对标（2026-09-26 实测）：peer phlox 4/4 工作流顶层显式 permissions、openemr 61/79 有；
# 我方此前 1/5。不写这一块的默认值是"仓库设置说了算"，同一份 YAML 在不同仓库设置下拿到的权限不同，
# 最小权限就无从核对。判据在 scripts/action_pin.py（--verify），越权即判红。
permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - name: 知识库回链可达性核验（死链即红；反爬须逐条登记，未登记的被拦源即红）
        working-directory: frontend
        run: node tests/link_health.mjs --json --timeout=35000
        continue-on-error: true   # 观察期开关：外部站点抖动会误红，先报告不阻断；连续两周零 DEAD 后删本行转硬门禁
