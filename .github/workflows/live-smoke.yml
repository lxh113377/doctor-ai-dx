name: Delivered artifact smoke

# 第二十三轮对标落地：OpenEMR 有 `recovery-path-smoketest.yml` 与 `release-mechanism-smoketest.yml`
# ——发布机制与恢复路径本身被定时真跑。我方 release.yml 只在**打 tag 那一刻**验一次镜像与线上，
# 之后 ghcr 的 `:latest` 与 pages.dev 再没有任何常驻判据：基础镜像被上游重建、Pages 侧配置漂移、
# 或线上被别的版本手工覆盖，都不会有东西变红。「发布完成」与「仍然可用」是两件事，此前只有前者有判据。
# 落点选择：不依赖本机（本机不可达 ghcr 是实测事实），全部在 runner 上做，零新增凭据。
on:
  schedule:
    - cron: "30 4 * * *"   # 每天 12:30 UTC+8，与 dep-audit（周一）/link-health（周三）/dep-triage（周二）错开
    # ⚠️ 第四十四轮实测：本仓 `event=schedule` 的 run **总数 = 0**（`gh api .../actions/runs?event=schedule`
    #   与 per-workflow 端点 `.../workflows/live-smoke.yml/runs` 的 total_count 均为 0，
    #   而 push / workflow_dispatch 正常）⇒ 只写 cron 等于把"线上仍然可用"的证据挂在一条没人走过的路上。
    #   保留 cron（哪天平台恢复触发就自动生效），另加下面这条**实测会触发**的通路：main 的 CI 完成后巡检。
  workflow_run:
    workflows: ["CI - build & deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# 每次 main 的 CI 完成都会排一次巡检：并发起来会白烧 runner 分钟，故同名只留最新一条。
concurrency:
  group: live-smoke
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/lxh113377/doctor-ai-dx:latest

jobs:
  published-image:
    name: 已发布镜像可拉 + 容器内自证 + 起服务打接口
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 匿名拉取 :latest（不带任何登录态——评审拿到的就是这一条命令）
        run: docker pull --platform linux/amd64 "$IMAGE"
      - name: 镜像内套件自证（清单单一源 backend/tests/suite.json）
        run: docker run --rm --workdir /srv/backend --entrypoint python "$IMAGE" selftest.py
      - name: 真起服务跑同一套线上断言（健康检查 + 三条红线 + 错误契约）
        run: |
          set -eu
          docker run -d --rm --name smoke -p 8787:8000 "$IMAGE"
          trap 'docker stop smoke >/dev/null 2>&1 || true' EXIT
          ok=""
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test -n "$ok" || { echo "容器 80s 内未就绪"; docker logs smoke 2>&1 | tail -30; exit 1; }
          python scripts/live_smoke.py --base-url http://127.0.0.1:8787

  live-site:
    name: 线上 Pages 持续可用（外部观察者视角）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 判据先自证（离线，喂合成响应给同一组断言）
        run: python scripts/live_smoke.py --selftest
      - name: 打线上：version 对账 + 404/413 契约 + 三红线在场 + 单次耗时
        run: python scripts/live_smoke.py

  # 第四十轮对标落地（台账 #24）：live 分支此前**没有任何浏览器级自动化**。
  # `app.spec.mjs` 刻意不设 Key（为了确定性，这是对的选择）⇒ 只覆盖 rule-fallback；
  # `live_path_guard.mjs` 用 fetch 桩在 Node 里测 ⇒ 测不到真浏览器里的渲染/溢出/控制台异常。
  # 判据纪律：只断言"红线在场 + 结构骨架 + 零控制台 error + version 对账"，**绝不断言结论文本**
  # （live 走 DeepSeek，同输入两次输出不同是常态；断言措辞＝测模型心情，红了无法定位）。
  # 分层口径：不进 `npm test`、不进 `ci.yml`（那条链必须零网络零密钥），挂在每日线上作业上，
  #          与 `live-site`/`online-eval` 同性质——红了单独知道，不拦合码（advisory 不阻断执行）。
  live-browser:
    name: 线上 live 分支浏览器级回归（只核红线在场与结构，不断言结论文本）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Node 环境（composite，第四十一轮 #46：改一次环境只改一处）
        uses: ./.github/actions/setup-node-frontend
      - name: Install（只取测试链所需，不构建——测的是线上已部署产物）
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: 跑 live 五步链路（retries=1 吸收公网抖动；断言本身不放水）
        working-directory: frontend
        run: npm run test:e2e-live
      - name: 失败时把线上真实版本与入口健康态打进摘要（区分"站点没了"与"渲染坏了"两类红因）
        if: failure()
        shell: bash
        # 写作约束（第四十轮 CI 实测）：本块曾被 shellcheck 判 SC1073 解析失败——形态是
        # "双引号串里嵌 $(curl … || echo 取不到（连接层失败）)"，多字节全角括号落在命令替换内。
        # CI 侧 lint 是唯一权威（本机无 docker 守护进程，跑不了 rhysd/actionlint），故这里改成
        # 先各自取值到变量、再只 echo 变量：诊断步骤本身不许把作业再弄红一次（失败面必须无能力失败）。
        run: |
          BASE="https://doctor-ai-dx.pages.dev"
          HEALTH="$(curl -s -m 20 "$BASE/api/health")" || HEALTH=""
          HTTPCODE="$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$BASE")" || HTTPCODE="000"
          if [ -z "$HEALTH" ]; then
            HEALTH="UNREACHABLE"
          fi
          {
            echo '### live 浏览器回归失败现场'
            echo
            echo "- BASE: $BASE"
            echo "- GET /api/health 响应体: \`$HEALTH\`"
            echo "- GET / 状态码: $HTTPCODE"
            echo "- 读数说明: health 为 UNREACHABLE 或状态码为 000 ⇒ 站点/网络层问题；两者正常而作业红 ⇒ 渲染或断言问题"
          } >> "$GITHUB_STEP_SUMMARY"

  # 第二十四轮对标落地：peer 侧 openemr 有 `docker/container_benchmarking/`、ragflow 有 `test/benchmark/`，
  # 而我方 docs/EVAL_CARD.md 的 p50 4.1s / p95 4.73s 长期是**一次本机运行的记录**——产出脚本不在仓里
  # （README 指的是一个 clone 后不存在的工作区路径），第三方既复现不了也无从知道它后来有没有退化。
  # 本作业把它变成每周机器复现：真跑 31 例 live + 同套硬门禁（P95≤10s、结构/引用/红旗全过）。
  online-eval:
    name: 线上性能与质量指标复现（EVAL_CARD 头条数字的来源作业）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 31 例 live 评测（结构/引用/红旗 + P50/P95/max，内置硬门禁）
        run: node scripts/live_eval.mjs
      - name: 性能地板线复核（刚产出的报告必须新鲜且达标；缺报告判 UNKNOWN 而非放行）
        run: node scripts/perf_gate.mjs
      - name: 评测报告发布为工件（让"最新一次真实评测"跨 run 可核，而不是只在本次作业里恒真）
        # perf_gate 的「新鲜度 ≤14 天」在本作业里永远为真——报告是上一步刚生成的。
        # 真正能过期的证据必须留在**作业之外**：工件带 created_at，由 scripts/live_freshness_guard.py
        # 在别的作业里回读，才谈得上"过期会红"。缺文件即判错（if-no-files-found: error）。
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: eval-report-live
          path: .eval/eval_report_live.json
          if-no-files-found: error
      - name: 把复现结果写进作业摘要（评审看的数字要能对到具体某次运行）
        if: always()
        run: |
          if [ -f .eval/eval_report_live.json ]; then
            { echo '### 线上评测复现回执'; echo; echo '```json'; cat .eval/eval_report_live.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### 线上评测复现：无报告产出（作业在评测步之前即失败）' >> "$GITHUB_STEP_SUMMARY"
          fi
