name: doctor-ai-dx

# 本地/评审用容器编排：把 FastAPI 镜像面（后端降级链路）一键跑起来。
# 边界（如实声明）：生产权威面是 Cloudflare Pages + Functions（serverless），不是可自托管的容器，
# 因此 compose 只编排 FastAPI 镜像面；前端演示请照 README 用 npm run dev / bash start-demo.sh。
# 密钥口径：DEEPSEEK_API_KEY 刻意不写进本文件——无 Key 时链路按设计降级为 rule-fallback，
# 需要 live 口径时由使用者自带：DEEPSEEK_API_KEY=sk-xxx docker compose up

services:
  backend:
    build:
      context: ./backend
    image: doctor-ai-dx-backend
    ports:
      - "8000:8000"
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      CORS_ORIGINS: "http://localhost:5173"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
    restart: unless-stopped

  selftest:
    # 一次性作业：镜像内可跑的那部分套件全绿即证明这份镜像可用（评审从零启动的自证入口）。
    # ⚠️ 范围（v1.41.0 实测澄清，别再把这句话说过头）：构建上下文只有 `backend/`，
    # 9 套里有 4 套要用 `parents[2]` 回仓库根取 `data/*.json` 与 `frontend/**` 做**源码级配对**
    # （镜像内该位置是 /srv/，Dockerfile 从未往那儿放东西）⇒ 这 4 套在镜像内**注定取不到**，
    # runner 逐条 SKIP 并点名缺失路径，可跑数由 backend/selftest.py 按 Dockerfile 现算，不写死名单。
    # 那 4 套的强制覆盖在 CI 的 backend-test（那里仓库根在场，跑的是全 9 套）。
    # 均为进程内 TestClient / 纯函数断言，不依赖 backend 服务在线，故不设 depends_on。
    # 套件清单**不在这里抄第二份**：由 backend/tests/suite.json 单源驱动（漏挂新套件由 scripts/suite_guard.py 判红）。
    build:
      context: ./backend
    image: doctor-ai-dx-backend
    entrypoint: ["sh", "-c"]
    command:
      - python selftest.py
    healthcheck:
      disable: true
